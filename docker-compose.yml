services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /app/data/and1.db
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?Set AUTH_PASSWORD_HASH in Dokploy}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in Dokploy}
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "and1", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sqlite_data:
