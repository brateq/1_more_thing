name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build, check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup override set 1.98.0
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ci
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Use the Ubuntu archive for browser system dependencies
        # The runner's Azure mirror can stall on the extra fonts/libraries Playwright needs.
        run: echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
      - run: npx --no-install playwright install --with-deps --only-shell chromium
      # Visual baselines are macOS-specific; exercise all functional browser tests on Linux.
      - run: npm run test:browser -- --grep-invert 'app views:'
